    function QuizGame({ wordList }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedColor, setSelectedColor] = useState(null);
      const [isCorrect, setIsCorrect] = useState(null);
      const [score, setScore] = useState(0);

      const currentWord = wordList[currentIndex] || wordList[0];

      const handleSelectColor = (colorName) => {
        if (selectedColor !== null) return;

        setSelectedColor(colorName);
        if (colorName === currentWord.color) {
          setIsCorrect(true);
          setScore(prev => prev + 10);
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
        } else {
          setIsCorrect(false);
        }
      };

      const handleNext = () => {
        setSelectedColor(null);
        setIsCorrect(null);
        if (currentIndex < wordList.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          setCurrentIndex(0);
          setScore(0);
        }
      };

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1 rounded-full border border-orange-200">
              문제 {currentIndex + 1} / {wordList.length} (점수: {score}점)
            </span>
          </div>

          <div className="bg-gradient-to-br from-amber-50 to-orange-50 rounded-3xl p-8 text-center border border-amber-200 relative shadow-inner">
            <span className="text-xs font-bold text-slate-400 mb-2 block">제시어</span>
            <h2 className="text-2xl md:text-3xl font-jua text-slate-800 mb-3 leading-snug">
              "{currentWord.text}"
            </h2>
            <p className="text-xs text-amber-800 font-medium">
              이 말에 어울리는 마음 색깔은 어떤 색일까요?
            </p>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
            {COLOR_PRESETS.map((color) => {
              const isSelected = selectedColor === color.name;
              let btnStyle = "bg-white border-2 border-slate-200 hover:border-orange-400";
              if (isSelected) {
                if (isCorrect) {
                  btnStyle = "bg-emerald-50 border-4 border-emerald-500 shadow-lg scale-105";
                } else {
                  btnStyle = "bg-rose-50 border-4 border-rose-500 shadow-lg";
                }
              }

              return (
                <button
                  key={color.name}
                  onClick={() => handleSelectColor(color.name)}
                  disabled={selectedColor !== null}
                  className={`p-4 rounded-2xl flex flex-col items-center gap-2 transition-all cursor-pointer ${btnStyle}`}
                >
                  <div className={`w-10 h-10 rounded-full shadow-inner ${color.bg} ${color.name === '하얀색' ? 'border border-gray-300' : ''}`} />
                  <span className="font-jua text-slate-700 text-sm">{color.name}</span>
                </button>
              );
            })}
          </div>

          {selectedColor && (
            <div className={`rounded-2xl p-4 text-center font-jua text-base animate-bounce ${
              isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
            }`}>
              {isCorrect ? (
                <div className="flex items-center justify-center gap-2">
                  <CheckCircle2 className="w-5 h-5 text-emerald-600" />
                  <span>딩동댕! 정답이에요! ({currentWord.color} - {currentWord.emotion})</span>
                </div>
              ) : (
                <div>
                  <span>아쉬워요! 어울리는 색은 [{currentWord.color}] 입니다.</span>
                </div>
              )}
              <button
                onClick={handleNext}
                className="mt-3 px-6 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold shadow-md hover:bg-slate-900 transition-all block mx-auto"
              >
                {currentIndex < wordList.length - 1 ? "다음 문제 ➔" : "처음으로 돌아가기"}
              </button>
            </div>
          )}
        </div>
      );
    }

    function PaintGame({ wordList, onGoHome }) {
      const [currentWordIndex, setCurrentWordIndex] = useState(0);
      const [color, setColor] = useState('#EF4444');
      const [lineWidth, setLineWidth] = useState(24);
      const [toolMode, setToolMode] = useState('brush');
      const [isEraser, setIsEraser] = useState(false);
      const [feedback, setFeedback] = useState(null);

      const canvasRef = useRef(null);
      const isDrawing = useRef(false);
      const lastPos = useRef({ x: 0, y: 0 });
      const history = useRef([]);

      const word = wordList[currentWordIndex] || wordList[0];

      useEffect(() => {
        resetCanvas();
        setFeedback(null);
      }, [currentWordIndex, word]);

      // 정답 색상 판별 및 폭죽 효과
      const checkColorAnswer = (currentColorHex) => {
        const targetPreset = COLOR_PRESETS.find(p => p.name === word.color);
        const activeHex = (currentColorHex || color).toLowerCase();
        
        if (targetPreset && targetPreset.hex.toLowerCase() === activeHex) {
          setFeedback({
            isCorrect: true,
            message: `🎉 딩동댕! 정답이에요! "${word.text}" 문장에 딱 어울리는 [${word.color}] 마음색입니다!`
          });
          confetti({
            particleCount: 80,
            spread: 90,
            origin: { y: 0.6 }
          });
        } else {
          setFeedback({
            isCorrect: false,
            message: `💡 이 문장에는 [${word.color}] 마음색이 더 잘 어울려요! 다른 색으로도 도전해볼까요?`
          });
        }
      };

      const resetCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        
        canvas.width = 500;
        canvas.height = 360;

        drawBubbleAndText('#F8FAFC');
        history.current = [];
        saveHistory();
        setFeedback(null);
      };

      const drawTextOverlay = (ctx) => {
        if (!ctx) return;
        ctx.save();
        const x = 50, y = 40, w = 400, h = 220, r = 30;
        
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.lineTo(x + 120, y + h);
        ctx.lineTo(x + 80, y + h + 50);
        ctx.lineTo(x + 160, y + h);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#475569";
        ctx.stroke();

        ctx.fillStyle = "#1E293B";
        ctx.font = "bold 22px 'Jua', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(`"${word?.text || ''}"`, 250, 150);
        ctx.restore();
      };

      const drawBubbleAndText = (fillBgColor = '#F8FAFC') => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const x = 50, y = 40, w = 400, h = 220, r = 30;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.lineTo(x + 120, y + h);
        ctx.lineTo(x + 80, y + h + 50);
        ctx.lineTo(x + 160, y + h);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();

        ctx.fillStyle = fillBgColor;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#475569";
        ctx.stroke();
        ctx.restore();

        drawTextOverlay(ctx);
      };

      const saveHistory = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        if (history.current.length > 15) history.current.shift();
        history.current.push(canvas.toDataURL());
      };

      const handleUndo = () => {
        if (history.current.length <= 1) return;
        history.current.pop();
        const lastState = history.current[history.current.length - 1];
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.src = lastState;
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          drawTextOverlay(ctx);
        };
      };

      const getCoordinates = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      const startDrawing = (e) => {
        const { x, y } = getCoordinates(e);

        if (toolMode === 'bucket') {
          const fillColor = isEraser ? '#F8FAFC' : color;
          drawBubbleAndText(fillColor);
          saveHistory();
          if (!isEraser) {
            checkColorAnswer(color);
          }
          return;
        }

        isDrawing.current = true;
        lastPos.current = { x, y };

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, lineWidth / 2, 0, Math.PI * 2);
        ctx.fillStyle = isEraser ? '#F8FAFC' : color;
        ctx.fill();
        ctx.restore();
        drawTextOverlay(ctx);
      };

      const draw = (e) => {
        if (!isDrawing.current || toolMode === 'bucket') return;
        const { x, y } = getCoordinates(e);
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');

        ctx.save();
        ctx.beginPath();
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = isEraser ? '#F8FAFC' : color;
        ctx.moveTo(lastPos.current.x, lastPos.current.y);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.restore();

        lastPos.current = { x, y };
        drawTextOverlay(ctx);
      };

      const stopDrawing = () => {
        if (isDrawing.current) {
          isDrawing.current = false;
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          drawTextOverlay(ctx);
          saveHistory();
        }
      };

      return (
        <div className="bg-white rounded-3xl p-6 shadow-xl border-2 border-emerald-100 max-w-4xl mx-auto space-y-4 animate-fade-in">
          <div className="flex items-center justify-between border-b pb-4">
            <button 
              onClick={onGoHome}
              className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all"
            >
              <ArrowLeft className="w-4 h-4" />
              <span>메인으로</span>
            </button>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setCurrentWordIndex((prev) => (prev > 0 ? prev - 1 : wordList.length - 1))}
                className="px-3 py-1 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-bold hover:bg-emerald-100"
              >
                ◀ 이전 말
              </button>
              <span className="text-xs font-bold text-slate-500">
                {currentWordIndex + 1} / {wordList.length}
              </span>
              <button
                onClick={() => setCurrentWordIndex((prev) => (prev < wordList.length - 1 ? prev + 1 : 0))}
                className="px-3 py-1 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-bold hover:bg-emerald-100"
              >
                다음 말 ▶
              </button>
            </div>
          </div>

          <p className="text-center text-xs text-slate-500 font-medium">
            💡 붓으로 색칠하거나, 페인트통을 선택해 말풍선을 한번에 채워보세요!
          </p>

          {/* Answer Feedback Banner */}
          {feedback && (
            <div className={`p-3.5 rounded-2xl text-center font-jua text-sm shadow-sm transition-all animate-fade-in ${
              feedback.isCorrect 
                ? 'bg-emerald-100 border-2 border-emerald-400 text-emerald-800' 
                : 'bg-amber-100 border-2 border-amber-300 text-amber-800'
            }`}>
              {feedback.message}
            </div>
          )}

          <div className="flex flex-col md:flex-row gap-4 items-center justify-center">
            <div className="relative border-4 border-slate-200 rounded-3xl overflow-hidden shadow-inner bg-white">
              <canvas
                ref={canvasRef}
                onMouseDown={startDrawing}
                onMouseUp={stopDrawing}
                onMouseMove={draw}
                onMouseLeave={stopDrawing}
                onTouchStart={startDrawing}
                onTouchEnd={stopDrawing}
                onTouchMove={draw}
                className="touch-none cursor-crosshair w-full max-w-[500px] h-auto"
              />
            </div>

            <div className="bg-slate-50 p-4 rounded-3xl border-2 border-slate-200 w-full md:w-64 space-y-4">
              <span className="font-jua text-slate-700 text-sm flex items-center gap-1 border-b pb-2">
                <Palette className="w-4 h-4 text-emerald-600" /> 색칠 도구 상자
              </span>

              <div className="space-y-4">
                {/* Tool Selection */}
                <div>
                  <label className="text-xs font-bold text-slate-500 mb-1.5 block">칠하기 방식</label>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => { setToolMode('brush'); setIsEraser(false); }}
                      className={`p-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1 border transition-all ${
                        toolMode === 'brush' && !isEraser
                          ? 'bg-emerald-500 text-white border-emerald-600 shadow'
                          : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                      }`}
                    >
                      <Brush className="w-4 h-4" />
                      <span>붓 칠하기</span>
                    </button>

                    <button
                      onClick={() => { setToolMode('bucket'); setIsEraser(false); }}
                      className={`p-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1 border transition-all ${
                        toolMode === 'bucket' && !isEraser
                          ? 'bg-emerald-500 text-white border-emerald-600 shadow'
                          : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                      }`}
                    >
                      <PaintBucket className="w-4 h-4" />
                      <span>전체 채우기</span>
                    </button>
                  </div>
                </div>

                {/* Palette Selection */}
                <div>
                  <label className="text-xs font-bold text-slate-500 mb-1.5 block">색상 선택</label>
                  <div className="grid grid-cols-3 gap-2">
                    {COLOR_PRESETS.map((c) => (
                      <button
                        key={c.name}
                        onClick={() => {
                          setColor(c.hex);
                          setIsEraser(false);
                        }}
                        className={`h-9 rounded-xl border-2 flex items-center justify-center transition-all ${
                          !isEraser && color === c.hex ? 'scale-110 border-slate-800 shadow' : 'border-transparent'
                        } ${c.bg}`}
                        title={c.name}
                      />
                    ))}
                  </div>
                </div>

                {/* Check Answer Button */}
                <button
                  onClick={() => checkColorAnswer(color)}
                  className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-jua shadow transition-transform active:scale-95 flex items-center justify-center gap-1.5"
                >
                  <CheckCircle2 className="w-4 h-4" />
                  <span>선택한 색이 정답인지 확인! 🎯</span>
                </button>

                {/* Brush Size Slider */}
                {toolMode === 'brush' && (
                  <div>
                    <div className="flex justify-between items-center text-xs font-bold text-slate-500 mb-1">
                      <span>{isEraser ? "지우개 크기" : "붓 두께"}</span>
                      <span>{lineWidth}px</span>
                    </div>
                    <input 
                      type="range" 
                      min="8" 
                      max="50" 
                      value={lineWidth} 
                      onChange={(e) => setLineWidth(Number(e.target.value))}
                      className="w-full accent-emerald-500 cursor-pointer"
                    />
                  </div>
                )}

                {/* Actions */}
                <div className="grid grid-cols-2 gap-2 pt-2 border-t">
                  <button
                    onClick={() => setIsEraser(!isEraser)}
                    className={`p-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1 border transition-all ${
                      isEraser ? 'bg-amber-500 text-white border-amber-600 shadow' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                    }`}
                  >
                    <Eraser className="w-3.5 h-3.5" />
                    <span>지우개</span>
                  </button>

                  <button
                    onClick={handleUndo}
                    className="p-2 bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 rounded-xl text-xs font-bold flex items-center justify-center gap-1"
                  >
                    <Undo className="w-3.5 h-3.5" />
                    <span>되돌리기</span>
                  </button>
                </div>

                <button
                  onClick={() => resetCanvas()}
                  className="w-full p-2 bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 rounded-xl text-xs font-bold flex items-center justify-center gap-1"
                >
                  <Trash2 className="w-3.5 h-3.5" />
                  <span>모두 지우기</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function BalloonGame({ wordList, onGoHome }) {
      const [addedWords, setAddedWords] = useState([]);
      const [userFaceImage, setUserFaceImage] = useState(null);
      const [scale, setScale] = useState(1);
      const [posX, setPosX] = useState(0);
      const [posY, setPosY] = useState(0);
      const [rotation, setRotation] = useState(0);

      const [showCamera, setShowCamera] = useState(false);
      const videoRef = useRef(null);
      const streamRef = useRef(null);

      // Dominant Category Stats
      const [categoryCounts, setCategoryCounts] = useState({ RED: 0, YELLOW: 0, GREEN: 0, BLUE: 0 });
      const [dominantCategory, setDominantCategory] = useState(null);

      // Camera control logic
      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
          streamRef.current = stream;
          setShowCamera(true);
        } catch (err) {
          alert("카메라에 접근할 수 없거나 권한이 거부되었습니다.");
        }
      };

      useEffect(() => {
        if (showCamera && streamRef.current && videoRef.current) {
          videoRef.current.srcObject = streamRef.current;
        }
      }, [showCamera]);

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
          streamRef.current = null;
        }
        setShowCamera(false);
      };

      const capturePhoto = () => {
        if (!videoRef.current) return;
        const video = videoRef.current;
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 300;
        canvas.height = video.videoHeight || 300;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/png');
        setUserFaceImage(dataUrl);
        stopCamera();
      };

      // Recalculate Dominant Category whenever addedWords changes
      useEffect(() => {
        const counts = { RED: 0, YELLOW: 0, GREEN: 0, BLUE: 0 };
        addedWords.forEach(w => {
          const cat = w.category || (
            w.color === '빨간색' || w.color === '검정색' ? 'RED' :
            w.color === '노란색' ? 'YELLOW' :
            w.color === '초록색' || w.color === '하얀색' ? 'GREEN' : 'BLUE'
          );
          if (counts[cat] !== undefined) {
            counts[cat] += 1;
          }
        });

        setCategoryCounts(counts);

        // Find max category
        let maxCat = null;
        let maxCount = 0;

        Object.entries(counts).forEach(([catKey, count]) => {
          if (count > maxCount) {
            maxCount = count;
            maxCat = catKey;
          }
        });

        setDominantCategory(maxCat ? MOOD_CATEGORIES[maxCat] : null);
      }, [addedWords]);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            setUserFaceImage(event.target.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleClearImage = () => {
        setUserFaceImage(null);
        setScale(1);
        setPosX(0);
        setPosY(0);
        setRotation(0);
      };

      const handleAddWord = (word) => {
        // Create unique instance id for duplicate entries
        const wordInstance = { ...word, instanceId: Date.now() + Math.random() };
        setAddedWords(prev => [...prev, wordInstance]);
        confetti({ particleCount: 20, spread: 40, origin: { y: 0.5 } });
      };

      const handleResetBalloon = () => {
        setAddedWords([]);
      };

      const handleDragStart = (e, word) => {
        e.dataTransfer.setData("application/json", JSON.stringify(word));
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDrop = (e) => {
        e.preventDefault();
        const data = e.dataTransfer.getData("application/json");
        if (data) {
          const word = JSON.parse(data);
          handleAddWord(word);
        }
      };

      const totalAdded = addedWords.length;

      return (
        <div className="bg-white rounded-3xl p-6 shadow-xl border-2 border-rose-100 max-w-4xl mx-auto space-y-6 animate-fade-in">
          {/* Header */}
          <div className="flex items-center justify-between border-b pb-4">
            <button 
              onClick={onGoHome}
              className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all"
            >
              <ArrowLeft className="w-4 h-4" />
              <span>메인으로</span>
            </button>
            <h2 className="text-lg font-jua text-rose-600 flex items-center gap-1.5">
              <Heart className="w-5 h-5 fill-rose-500" /> 3단계: 내 마음 풍선 채우기
            </h2>
            <button
              onClick={handleResetBalloon}
              className="flex items-center gap-1 px-3 py-1.5 bg-rose-50 text-rose-600 rounded-xl text-xs font-bold hover:bg-rose-100"
            >
              <RotateCcw className="w-3.5 h-3.5" />
              <span>풍선 비우기</span>
            </button>
          </div>

          <p className="text-center text-xs text-slate-500 font-medium">
            💡 나의 얼굴 사진을 찍거나 업로드하여 캐릭터를 완성하고, 말카드를 자유롭게(중복 가능) 선택해 풍선을 채워보세요!

              <div className="text-center">
                <span className="text-xs font-bold text-slate-700 block mb-2">📷 내 얼굴 사진 합성</span>
                
                {}
                <div className="flex items-center justify-center gap-2 flex-wrap">
                  <button
                    onClick={startCamera}
                    className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-orange-500 hover:bg-orange-600 text-white rounded-xl text-xs font-bold shadow transition-all"

                        <circle cx="130" cy="135" r="4" fill="#1B2B4C" />
                        <circle cx="170" cy="135" r="4" fill="#1B2B4C" />
                        <line x1="145" y1="145" x2="155" y2="145" stroke="#CF3A3A" strokeWidth="3" strokeLinecap="round" />
                        <path d="M 140 160 Q 150 165 160 160" stroke="#1B2B4C" strokeWidth="3" fill="none" strokeLinecap="round" />
                      </g>
                    )}

                    {/* Straw Hat Top Overlay */}
                    <path d="M 70 100 Q 150 60 230 100 L 250 105 Q 150 80 50 105 Z" fill="#F0C27B" stroke="#1B2B4C" strokeWidth="4" />
                    <path d="M 95 95 Q 150 40 205 95 Z" fill="#F0C27B" stroke="#1B2B4C" strokeWidth="4" />
                    <path d="M 96 85 Q 150 50 204 85" stroke="#D9534F" strokeWidth="8" fill="none" />
                  </g>
                </svg>

                {/* Uploaded User Face Mask Overlay Container */}
                {userFaceImage && (
                  <div 
                    className="absolute w-28 h-28 rounded-full border-2 border-dashed border-rose-400 overflow-hidden shadow-md"
                    style={{
                      top: '20%',
                      left: 'calc(50% - 56px)'
                    }}
                  >
                    <img 
                      src={userFaceImage} 
                      alt="User Face" 
                      className="w-full h-full object-cover transition-transform"
                      style={{
                        transform: `scale(${scale}) translate(${posX}px, ${posY}px) rotate(${rotation}deg)`
                      }}
                    />
                  </div>
                )}
              </div>

              {}
              {showCamera && (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                  <div className="bg-white p-4 rounded-3xl max-w-sm w-full space-y-4 text-center shadow-2xl">
                    <h3 className="font-jua text-lg text-slate-800">📷 사진 찍기</h3>
                    <div className="relative rounded-2xl overflow-hidden bg-black aspect-square">
                      <video 
                        ref={videoRef} 
                        autoPlay 
                        playsInline 
                        className="w-full h-full object-cover" 
                      />
                    </div>
                    <div className="flex justify-center gap-3">
                      <button
                        onClick={capturePhoto}
                        className="px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-jua text-sm shadow"
                      >
                        📸 촬영하기
                      </button>
                      <button
                        onClick={stopCamera}
                        className="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold text-xs"
                      >
                        취소
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Adjust Controls for Face Photo */}
              {userFaceImage && (
                <div className="bg-white p-3 rounded-2xl border border-amber-200 text-xs space-y-2 animate-fade-in">
                  <span className="font-bold text-slate-700 block text-center border-b pb-1">🎛️ 사진 크기 및 위치 조절</span>
                  <div className="space-y-1">
                    <div className="flex justify-between font-medium text-slate-500">
                      <span>크기 (Zoom)</span>
                      <span>{scale.toFixed(1)}x</span>
                    </div>
                    <input 
                      type="range" min="0.5" max="2.5" step="0.1" 
                      value={scale} onChange={(e) => setScale(parseFloat(e.target.value))} 
                      className="w-full accent-rose-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <span className="text-[10px] font-medium text-slate-500 block">좌우 이동 (X)</span>
                      <input 
                        type="range" min="-40" max="40" 
                        value={posX} onChange={(e) => setPosX(parseInt(e.target.value))} 
                        className="w-full accent-rose-500"
                      />
                    </div>
                    <div>
                      <span className="text-[10px] font-medium text-slate-500 block">상하 이동 (Y)</span>
                      <input 
                        type="range" min="-40" max="40" 
                        value={posY} onChange={(e) => setPosY(parseInt(e.target.value))} 
                        className="w-full accent-rose-500"
                      />
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* Right Column: Balloon Drop Zone & Dynamic Dominant Color Categorization */}
            <div className="lg:col-span-7 space-y-4">
              {/* Balloon Graphic Zone */}
              <div 
                onDragOver={handleDragOver}
                onDrop={handleDrop}
                className="relative bg-gradient-to-b from-slate-50 to-rose-50/50 rounded-3xl p-6 border-2 border-dashed border-rose-300 flex flex-col items-center justify-center min-h-[300px] shadow-inner"
              >
                {/* Dynamic Balloon with Categorical Dominant Color */}
                <div className="relative flex flex-col items-center">
                  <div 
                    className="w-48 h-56 rounded-full balloon-pulse flex flex-col items-center justify-center shadow-2xl border-4 border-white transition-all duration-700 relative overflow-hidden"
                    style={{
                      backgroundColor: dominantCategory ? dominantCategory.hex : '#F1F5F9'
                    }}
                  >
                    <Heart className="w-16 h-16 text-white/30 fill-white/20 absolute" />
                    
                    <div className="z-10 text-center p-3 space-y-1">
                      <span className={`text-xs font-jua px-3 py-1 rounded-full shadow-sm ${
                        dominantCategory ? 'bg-white text-slate-800' : 'bg-slate-200 text-slate-600'
                      }`}>
                        {dominantCategory ? `${dominantCategory.name} 마음풍선` : "텅 빈 마음풍선"}
                      </span>

                      {dominantCategory ? (
                        <p className="text-[11px] font-bold text-white drop-shadow-md">
                          주된 감정: {dominantCategory.label}
                        </p>
                      ) : (
                        <p className="text-[11px] font-medium text-slate-500">
                          말카드를 넣어 색을 채워주세요
                        </p>
                      )}

                      <span className="text-[10px] font-bold text-white/90 bg-black/20 px-2 py-0.5 rounded-full inline-block">
                        담긴 말: {totalAdded}개
                      </span>
                    </div>
                  </div>

                  {/* Balloon String */}
                  <div className="w-1 h-12 bg-slate-400"></div>
                </div>

                {/* Dominant Category Breakdown Bar */}
                {totalAdded > 0 && (
                  <div className="w-full mt-4 bg-white rounded-2xl p-3 border border-rose-200 space-y-2">
                    <span className="text-xs font-bold text-slate-700 block text-center">
                      📊 풍선 안 감정색 범주 구성 (가장 많은 색깔로 풍선이 변해요!)
                    </span>

                    <div className="h-4 w-full bg-slate-100 rounded-full overflow-hidden flex shadow-inner">
                      {categoryCounts.RED > 0 && (
                        <div 
                          className="bg-red-500 h-full transition-all" 
                          style={{ width: `${(categoryCounts.RED / totalAdded) * 100}%` }}
                          title={`빨간색: ${categoryCounts.RED}개`}
                        />
                      )}
                      {categoryCounts.YELLOW > 0 && (
                        <div 
                          className="bg-amber-400 h-full transition-all" 
                          style={{ width: `${(categoryCounts.YELLOW / totalAdded) * 100}%` }}
                          title={`노란색: ${categoryCounts.YELLOW}개`}
                        />
                      )}
                      {categoryCounts.GREEN > 0 && (
                        <div 
                          className="bg-emerald-500 h-full transition-all" 
                          style={{ width: `${(categoryCounts.GREEN / totalAdded) * 100}%` }}
                          title={`초록색: ${categoryCounts.GREEN}개`}
                        />
                      )}
                      {categoryCounts.BLUE > 0 && (
                        <div 
                          className="bg-blue-500 h-full transition-all" 
                          style={{ width: `${(categoryCounts.BLUE / totalAdded) * 100}%` }}
                          title={`파란색: ${categoryCounts.BLUE}개`}
                        />
                      )}
                    </div>

                    <div className="grid grid-cols-4 text-center text-[10px] font-bold">
                      <span className="text-red-600">빨강: {categoryCounts.RED}</span>
                      <span className="text-amber-600">노랑: {categoryCounts.YELLOW}</span>
                      <span className="text-emerald-600">초록: {categoryCounts.GREEN}</span>
                      <span className="text-blue-600">파랑: {categoryCounts.BLUE}</span>
                    </div>
                  </div>
                )}
              </div>

              {}
              <div className="space-y-2">
                <span className="text-xs font-bold text-slate-600 block">
                  담을 말 선택 (여러 번 누르거나 풍선 위로 계속 끌어다 놓으세요):
                </span>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-52 overflow-y-auto custom-scrollbar p-1">
                  {wordList.map((word) => {
                    const catObj = MOOD_CATEGORIES[word.category] || MOOD_CATEGORIES.YELLOW;

                    return (
                      <div
                        key={word.id}
                        draggable
                        onDragStart={(e) => handleDragStart(e, word)}
                        onClick={() => handleAddWord(word)}
                        className="p-3 rounded-2xl border text-left transition-all cursor-pointer flex items-center justify-between bg-white border-slate-200 hover:border-rose-400 hover:shadow-md transform hover:-translate-y-0.5 active:scale-95"
                      >
                        <div>
                          <p className="text-xs font-bold text-slate-800">{word.text}</p>
                          <span className="text-[10px] text-slate-400">{word.emotion}</span>
                        </div>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full text-white ${catObj.bg}`}>
                          {catObj.name}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
